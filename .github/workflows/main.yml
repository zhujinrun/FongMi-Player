name: Build/release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096

    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest 正在从 24.04 迁往 26.04（GitHub 已发 notice），
        os: [windows-latest, macos-latest, ubuntu-24.04]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - name: Install Node.js 18.x
        uses: actions/setup-node@v6
        with:
          node-version: 18.18.0
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Linux packaging deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm
          rpmbuild --version

      - name: Build app
        run: yarn build

      - name: Diagnose Linux runner
        if: runner.os == 'Linux'
        run: |
          cat /etc/os-release
          df -h /

      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Upload Artifact (macOS)
        uses: actions/upload-artifact@v6
        with:
          name: fmplayer-mac
          path: ./dist/*-mac-*.dmg
          if-no-files-found: ignore

      - name: Upload Artifact (Windows)
        uses: actions/upload-artifact@v6
        with:
          name: fmplayer-win
          path: ./dist/*-win-*.exe
          if-no-files-found: ignore

      - name: Upload Artifact (Linux AppImage)
        uses: actions/upload-artifact@v6
        with:
          name: fmplayer-linux-appimage
          path: ./dist/*.AppImage
          if-no-files-found: ignore

      - name: Upload Artifact (Linux deb)
        uses: actions/upload-artifact@v6
        with:
          name: fmplayer-linux-deb
          path: ./dist/*.deb
          if-no-files-found: ignore

      - name: Upload Artifact (Linux rpm)
        uses: actions/upload-artifact@v6
        with:
          name: fmplayer-linux-rpm
          path: ./dist/*.rpm
          if-no-files-found: ignore
